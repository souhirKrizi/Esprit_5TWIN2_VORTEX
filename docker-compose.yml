services:
  app:
    build: .
    image: ghcr.io/souhirkrizi/heatalert:latest
    env_file: .env.production
    ports: ["8081:80"]
    volumes: ["app_storage:/var/www/html/storage/app/public"]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12

  prometheus:
    image: prom/prometheus:v3
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:13.2.5-ubuntu
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]

  blackbox:
    image: prom/blackbox-exporter:v0

  mysql-exporter:
    image: prom/mysqld-exporter:v0
    command: ["--mysqld.address=db:3306", "--mysqld.username=root"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db: { condition: service_healthy }

volumes:
  app_storage:
  db_data:
  grafana_data: